name: Correctness and cost budgets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: pytest tests/test_optimization.py tests/test_api.py tests/test_explain.py -q
      - name: Original correctness tests
        run: pytest tests/test_question1.py tests/test_question2.py -k 'not baseline_cost_is_high and not help_center_exceeds_context' -q
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web run typecheck
